name: Deploy Backend

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run tests
      run: |
        cd backend
        npm test
      continue-on-error: true
    
    - name: Build check
      run: |
        cd backend
        npm run build || echo "No build script found, continuing..."
    
    - name: Deployment Status
      run: |
        echo "✅ Backend is ready for deployment!"
        echo ""
        echo "📋 Deployment Options:"
        echo "1. Railway: https://railway.app"
        echo "2. Render: https://render.com"
        echo "3. Heroku: https://heroku.com"
        echo "4. Vercel: https://vercel.com"
        echo ""
        echo "🔧 Required Environment Variables:"
        echo "- MONGODB_URI"
        echo "- JWT_SECRET"
        echo "- PORT (optional, defaults to 5000)"
        echo ""
        echo "📁 Backend directory: ./backend"
        echo "🚀 Start command: npm start" 